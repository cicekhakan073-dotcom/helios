[package]
name = "shared"
version = "0.0.0"
edition = "2021"
publish = false
description = "Helios — paylaşılan tipler, hatalar, sabitler ve TTL helper'ları (no_std)."

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
